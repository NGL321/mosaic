# PROTOTYPE — inquiries/172-formation-signature-grokking/env.lock
#
# THE OTHER FILE THAT FREEZES. Committed in the SAME COMMIT as config.yaml, and separate
# from it on purpose: `inquiries/README.md` says an Experiment is identified by its
# config's sha256 AND NOTHING ELSE, so folding the environment into config.yaml would fork
# every Experiment on a base bump and make a byte-identical config under another Inquiry
# stop being the same Experiment. Frozen together; identity kept apart.
#
# RESOLVED DURING SEARCHING, never chosen at charter time. Finding the versions where the
# thing runs at all is adequacy-phase work — hypothesis-blind by construction, and
# therefore exactly what agents were authorised to search over. Any number of attempts;
# the last one wins and freezes.

inquiry: 172
resolved: 2026-08-11          # the day adequacy passed. Same commit as config.yaml.

# Pinned HERE, not read from tools/env/base.digest at run time. A frozen Inquiry that
# silently acquires a new CUDA the next time it is re-run is precisely the failure this
# whole answer exists to prevent — and it is the failure a repo-level indirection would
# introduce. See finding 4.
base:
  image: ghcr.io/ngl321/mosaic-base
  digest: sha256:9c1f1a1e4a1f3b8f4d2c5e6a7b8c9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708

# `uv pip compile --generate-hashes`. Every wheel by version AND sha256: a version alone
# is a name a registry can repoint, which is the same failure a tag is.
packages:
  - torch==2.4.1 --hash=sha256:1e3d9a41c2b7f6a8d5c4b3a29180f7e6d5c4b3a29180f7e6d5c4b3a29180f7e6
  - numpy==1.26.4 --hash=sha256:2f4e8b7c6d5a4938271605f4e3d2c1b0a9f8e7d6c5b4a39281706f5e4d3c2b1a
  - ripser==0.6.4 --hash=sha256:3a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
  - persim==0.3.5 --hash=sha256:4b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a
  - scikit-learn==1.5.2 --hash=sha256:5c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b

# What neither the digest nor the lock can pin, recorded so the gap is visible rather than
# assumed away. The host NVIDIA driver lives OUTSIDE the container by construction — the
# container runtime injects it — so it is stated as a RANGE here and as an OBSERVED VALUE
# in every manifest. This is the honest edge of the reproducibility claim, and finding 2.
host_boundary:
  nvidia_driver: ">= 550.54"
  note: >
    Injected by the container runtime from the host. Not reproducible by this repository.
    Recorded per run so a disagreement between two runs of one Experiment is diagnosable
    rather than mysterious.

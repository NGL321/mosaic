# ===========================================================================
# TRACKER — 9, all over the `issue` class fragment (7 + pull-request and
# review-record, minted by #228)
# ===========================================================================

map:
  gloss: A wayfinding map — destination, decisions, fog, scope
  fragment: issue
  gaps: [no-review-of-record]      # gaps.yaml — moved off the fragment by #228
  locate: {surface: tracker, path: "issue, label wayfinder:map"}
  track: tooling
  facing: agent
  mutability: amendable
  note: >
    Not a special case of `ticket` and not its parent — a peer. `claim` is legal on a
    ticket and meaningless on a map, so inheritance fails; the shared substance is
    factored into the `issue` fragment instead. The only class here whose lifecycle
    includes its own closure condition — a shape #229's kernel will meet again.

ticket:
  gloss: One decision, sized to a session
  fragment: issue
  gaps: [no-review-of-record]      # gaps.yaml — moved off the fragment by #228
  locate: {surface: tracker, path: "issue, label wayfinder:research|grilling|prototype|task"}
  track: tooling
  facing: agent
  mutability: amendable
  ticket_types: [research, grilling, prototype, task]
  state_labels: [agent:dispatched, agent:in-progress, agent:blocked]
  state_labels_note: >
    ADDED BY #232, and forced by the `issue` fragment rather than chosen: `labelled` says an
    issue carries EXACTLY the labels its class declares, so a mandate label that is declared
    nowhere puts every dispatched ticket outside its own class. `locate.path` carries the
    IDENTITY labels — what makes the class queryable — and these are STATE, so they need
    their own key.
    ADOPTED VERBATIM from #24 rather than re-coined, because that prototype settled their
    BEHAVIOUR and a rename would inherit the behaviour while losing the citation:
    `agent:dispatched` is consumed by the run answering it, so re-dispatch is an act by a
    named actor; `agent:in-progress` is the concurrency guard, and works whether or not a
    workflow's `concurrency:` block was written correctly; `agent:blocked` is ordinary
    traffic cleared by whoever clears the block, and the THIRD identical block opens an
    issue instead of retrying.
    These three are also the whole of the mandate — there is no mandate artifact and no
    register of open mandates. They are a label query (premise 20).
  note: >
    One class, not four. The types differ in PROCEDURE — a research ticket resolves via
    subagent, a grilling ticket via a live session — and procedure does not individuate.
    Holding them as an attribute is what keeps #223's "extensible" promise cheap: a fifth
    type is one enum value, not a fifth class times every intent.

debt-verification:
  gloss: A derivation step Noah cannot yet defend unaided
  fragment: issue
  gaps: [no-review-of-record]      # gaps.yaml — moved off the fragment by #228
  locate: {surface: tracker, path: "issue, label debt:verification"}
  track: research
  facing: agent
  mutability: amendable
  debtor: noah
  discharged_by: learning, on the Curriculum
  authority: curriculum/README.md, "#189"

debt-source:
  gloss: An assertion the record has not sourced
  fragment: issue
  gaps: [no-review-of-record]      # gaps.yaml — moved off the fragment by #228
  locate: {surface: tracker, path: "issue, label debt:source"}
  track: research
  facing: agent
  mutability: amendable
  debtor: agent
  discharged_by: search, producing a Source
  note: >
    Two classes, not one labelled class. #224 found this pair splitting the ACTOR COLUMN
    inside a single cell of file@debt-issue and carried it to #228 as "either two classes
    or a conditional". Individuation by intent-set answers it here: different debtor,
    different discharge, therefore different classes — and the cell stops straining.
    Taken back off #228.

custody-waiver:
  gloss: A custody obligation the scaffolding era defers
  fragment: issue
  gaps: [no-review-of-record]      # gaps.yaml — moved off the fragment by #228
  locate: {surface: tracker, path: "issue, label custody:deferred"}
  track: tooling
  facing: agent
  mutability: amendable
  authority: PROTOCOL.md §2, §5 — blocks 1.0.0 until discharged

health-review:
  gloss: A programme health review, with one Hard Core member as its defendant
  fragment: issue
  gaps: [no-review-of-record]      # gaps.yaml — moved off the fragment by #228
  locate: {surface: tracker, path: "issue, label health:review"}
  track: research
  facing: agent
  mutability: amendable
  authority: "#88"

prospect-backlog:
  gloss: The ledger of notions in flight
  fragment: issue
  gaps: [no-review-of-record]      # gaps.yaml — moved off the fragment by #228
  locate: {surface: tracker, path: "issue #109"}
  track: research
  facing: human
  mutability: append-only
  authority: "#109, #189"
  note: >
    ONE ISSUE, ONE CLASS holds here without an exemption. A Prospect is a ROW in this
    ledger, not an artifact of its own — structurally identical to index-manifest on
    Drive. The justification is not queue bandwidth but curriculum/README.md's own test:
    "is there a debtor and a discharge procedure". #189 removed Prospects from the ledger
    on exactly that test — "an open problem nobody can discharge is a Prospect, not a
    debt" — so a Prospect is not a work-item being kept out of the queue, it is not a
    work-item.
    TRIPWIRE: if Prospects begin acquiring assignees or blocking edges inside the
    backlog, the ledger has become a queue and must split into issues.


# --- MINTED UNDER #228 -----------------------------------------------------
# Found by working cells, not by sweeping directories: #226's `review` intent
# writes a judgement against a subject, and §5's defence gate is "a checker
# agent, on the pull request". Neither artifact had a class. This is not a break
# of the key (premise 2 is intact); it is the class axis being short, and the
# ~130-cell transcription cannot start with three of its targets missing.

pull-request:
  gloss: The merge unit — every branch lands through one
  fragment: issue
  locate: {surface: tracker, path: "pull request on the repository"}
  track: {derived: true, derived_from: branch}
  custody: agent-writable
  origin: authored
  facing: human
  mutability: amendable
  authority: PROTOCOL.md §6, §5
  note: >
    DECLARES NO GAP. This is the one tracker class that HAS a reviewer of record —
    §5 prescribes a checker agent and §6 requires a reviewer other than the author —
    and it is what moved `no-review-of-record` off the `issue` fragment into
    gaps.yaml. It composes the fragment for what the fragment actually shares:
    identity by number, labels, and closed-never-deleted.
    `track` is DERIVED (derivations.yaml): a pull request takes its branch's track.
    §6's merge spine already admits this by taking `track` as a parameter, and #176
    ruled a mixed-track branch a violation, so the derivation is single-valued.
    LIFECYCLE: amendable until merged, frozen after. Recorded as a note rather than
    a second class — a merged PR is the same artifact, later.

review-record:
  gloss: A judgement recorded against a subject artifact by a named party
  fragment: issue
  locate: {surface: tracker, path: "review on a pull request"}
  track: {derived: true, derived_from: subject}
  custody: agent-writable
  origin: authored
  facing: agent
  mutability: frozen
  subject: required
  authority: PROTOCOL.md §5 "Gate artifacts are record, not belief"; §8 Review
  note: >
    §5 defuses the trap this class would otherwise carry: "a checker agent's
    critique of a falsifier draft... land in the record even though their SUBJECT
    is belief. Custody follows the file, never the topic." So custody here is
    agent-writable however human-authored the subject is — if custody flowed from
    the subject, a review of a CONTEXT.md proposal would be human-only, forbidding
    the checker agent §5 explicitly prescribes.
    `frozen`: a judgement is made at a time. A changed judgement is a new review.
    Carries #226's `subject:` field, which is why the class needs no per-subject
    variants.


# The artifact-class table (premise 4), enumerated under #227.
#
# Class is finer than location, and is DERIVED FROM location, never the reverse
# (premise 2). Forty-two classes across three surfaces. The ticket estimated
# "roughly twenty"; the count was a floor, and it was low by half.
#
# AMENDED BY #228 — 45. Working the hard cells found three classes this
# enumeration never reached, because it swept the record by LOCATION and these
# three are named only inside obligations: `pull-request` and `review-record`
# (tracker) and `defence` (address deferred). A directory sweep cannot find an
# artifact the protocol describes but never files. #228 also gave `track` its
# first DERIVED value, for exactly those three — see derivations.yaml.
#
# ---------------------------------------------------------------------------
# THE FLAGS — five, plus a typed address
# ---------------------------------------------------------------------------
#
#   track      research | tooling                     PROTOCOL §1
#   custody    human-authored | human-signed | agent-writable
#   origin     authored | generated | vendored
#   facing     human | agent
#   mutability amendable | append-only | frozen
#
#   locate     {surface, path, licence}               a TYPED address, not a string
#
# `surface` and `licence` are components of the address rather than flags of
# their own. #224 raised `surface` as a candidate fourth flag; it was ruled a
# component instead, because `locate` already points at a location and a second
# field naming the same thing is the redundancy, not the safeguard. Nothing is
# parsed out of a string — the surface is DECLARED, so premise 2's derivation
# direction holds. `licence` rides the address for the same reason and one more:
# it exists only on `surface: repository`, so a class-level flag would read `n/a`
# on two surfaces out of three.
#
# ONE CLASS, ONE ADDRESS. A class that lives in two places is two classes. The
# record already did this twice before anyone wrote it down — the debt ledger is
# `debt-verification`/`debt-source` on the tracker PLUS `curriculum-open` in the
# repository, and a run is `run-manifest` in the repository PLUS `run-output` in
# Drive. A backup is not the thing it backs up.
#
# ONE FILE, ONE CLASS. Sub-file classes were drafted and then ruled out: they are
# hard to track and splitting the file is cheap. Three files in this repository
# hold two flag-sets each and are therefore filed for splitting — see the FILED
# block at the foot of this header. Extended to the tracker as ONE ISSUE, ONE
# CLASS.
#
# INDIVIDUATION (#227): two artifacts are one class unless they differ in a flag
# OR in the set of intents legal on them. Procedure is deliberately NOT an
# individuator — individuating by procedure would key the Operation layer to how
# an obligation is currently met, which is premise 1 inverted. This is what makes
# `debt-verification` and `debt-source` two classes (different debtor, different
# discharge) while `research`/`grilling`/`prototype`/`task` tickets are one
# (same intents; only the resolving procedure differs).
#
# ---------------------------------------------------------------------------
# WHAT THE ENUMERATION FOUND
# ---------------------------------------------------------------------------
#
# 1. `origin` needed a THIRD value. #224 split `custody` from `origin` and left
#    origin binary. The vendored skill trees and the two licence texts are bytes
#    neither Noah nor an agent wrote — README.md classifies them "Third-party —
#    neither". Calling them `authored` would make `agent-writable` mean an agent
#    may edit a vendored file, which is exactly backwards. Live, not theoretical:
#    `writing-great-skills` was deleted from both trees this week.
#
# 2. `custody` needed a THIRD value. PROTOCOL §5 has three postures, not two, and
#    the two-value flag was collapsing the middle one:
#      human-authored  §5's "three exceptions, and they are the whole list" —
#                      the keystrokes ARE the claim, drafting assistance destroys
#                      the thing claimed (competence floor, falsifiers, creative
#                      and proof deliverables)
#      human-signed    §5's "agent-drafted, human-signed" — an agent proposes
#                      exact text, the human applies and commits
#      agent-writable  an agent commits directly
#    Premise 3 already named this: "where §5's third posture applies, `propose`
#    is its own intent". #224's `custody: human-only` meant "committed under a
#    human identity" (§5: "a path check sees who committed"), never "typed by a
#    human", and nothing in the flag said so.
#
# 3. `facing` is a flag, and it is about REGISTER, not obligation. It was drafted
#    as load obligation and ruled back to preference: who the file is written
#    for. An agent-facing file prefers compact over pretty; a human-facing file
#    is what someone new to the project reads. Neither excludes the other reader.
#
# 4. `mutability` is a flag, and it is where "log" lives. ADR looked like a class
#    of its own — a record kept for posterity rather than active use — but what
#    every such artifact shares is that it is NEVER EDITED, and the record says
#    so repeatedly and in those words: axiom.md "append-only" (inquiries),
#    "Never remove a row from a manifest" (DATA-PROTOCOL §2), "Frozen, in the
#    strong sense" (literature), "superseded, never deleted" (docs/adr), the
#    scrub allow-list "append-only" (notebook). No flag said any of it. The flag
#    predicts intents — `amendable` admits amend, `append-only` admits append,
#    `frozen` admits only supersede — which is the evidence it is an axis and
#    not a family. The artifact-generation phase of the programme will emit
#    `frozen` and `append-only` almost exclusively.
#
# 5. `defence` is NOT here. #224 carried `defence: owed | not-owed`; it survived
#    the derivability test (research-track `debt-issue` is not-owed) but was
#    ruled a property of the INTENT, not the class, and handed to #226. Noah's
#    reasoning, which is stronger than the flag was: a landed change that owed a
#    defence and does not have one is a BREACH, not a state — if the procedure
#    was followed the defence was already granted, so an artifact carrying
#    "defence: owed" as a standing condition describes a violation, not a class.
#
# ---------------------------------------------------------------------------
# WHAT THE ENUMERATION LEFT OPEN
# ---------------------------------------------------------------------------
#
#   `scrub-allowlist` HAS NO ADDRESS. notebook/README.md specifies it completely
#   — per line, per transcript, hand-written, append-only, "itself part of the
#   record" — and never says where it lives. #228 found the second instance,
#   `defence`, and promoted this to a NAMED gap in gaps.yaml: two instances from
#   two directions is a pattern, not a note on one class.
#
#   `charter` and the three `conjecture-*` classes HAVE NO INSTANCES. Deliberate
#   in both cases (§5 pins CHARTER.md's path "before it is written, because the
#   custody check keys on paths"; #7 has not named the first Belt claim).
#
#   `conjecture-governor`'s custody is DEFERRED. conjectures/README.md says
#   "amendable by Noah" (posture 2) and "Agents amend nothing, ever" (posture 1)
#   in consecutive sentences. Cheap to defer: zero instances.
#
# FILED, NOT FIXED HERE (premise 13/15 — this map finds, other tickets repair).
# All five are children of #1, the founding-charter map:
#   - README.md's licence table is superseded by `locate.licence` and must cite
#     it rather than hold it
#   - CONTEXT.md splits (one file, one class + the Ralph-loop context floor)
#   - conjectures/ splits three ways (statement / falsifier / governor)
#   - the notebook entry becomes two sources plus a generated render
#   - PROTOCOL §5's exception table says the competence floor lands in
#     CONTEXT.md; it lives at curriculum/FLOOR.md, and §5 says "the custody
#     check keys on paths"


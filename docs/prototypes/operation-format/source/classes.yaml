defence:
  gloss: What changed and why, in Noah's own words
  locate: DEFERRED
  gaps: [no-address]
  track: {derived: true, derived_from: subject}
  custody: human-authored
  origin: authored
  facing: human
  mutability: frozen
  authority: PROTOCOL.md §5 "The defence — which changes owe one"
  note: >
    #224 carried `defence` as a class FLAG; #227 removed it on Noah's argument that
    an undefended landed change is a BREACH, not a state, and routed it to #226 —
    which had already closed four hours earlier. #228 found the artifact itself was
    never given a class at all.
    NOT A SECTION OF THE PULL REQUEST. The PR is agent-writable and a defence is
    human-authored — §5: "in Noah's own words", where "the keystrokes ARE the claim"
    — which is two flag-sets in one artifact and a split by #227's own rule.
    ADDRESS DEFERRED, and filed against #1 rather than decided here (premise 13):
    §5 says a defence is carried on the pull request and never says what it IS. This
    is the second instance of the `no-address` gap after scrub-allowlist. The finding
    for that ticket, not a ruling here: a committed file beats a PR comment, because
    #203 is exactly the lesson about assertions no clone can verify.
    What DERIVES is the necessity of a defence (derivations.yaml), never the defence.

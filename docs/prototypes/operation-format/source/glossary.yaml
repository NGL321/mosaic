# PROTOTYPE — glossed inline, ADDED AFTER THE ACCEPTANCE TEST.
#
# The cold agent on `add@CONTEXT-entry` refused correctly and then named this: the entry
# uses "competence floor" and "Provenance Tier" and defines neither, and it felt the pull
# to go open PROTOCOL.md. That pull IS the premise-16 failure — an entry that sends you
# elsewhere to understand it has not been flattened, only shortened.
#
# So terms are a fourth factored layer. Written once, spliced into every entry that uses
# one. This is premise 10 applied to vocabulary rather than to steps.

competence floor:
  gloss: >
    Noah's declared statement of what he can defend unaided. Defence terminates AT the
    floor, not at first principles. Declared in curriculum/FLOOR.md.
  authority: PROTOCOL.md §5 "The competence floor"
Provenance Tier:
  gloss: A graded annotation of how well warranted a claim is. External contributions land at the bottom tier.
  authority: PROTOCOL.md §8
Verification Debt:
  gloss: A derivation step the programme has not checked. Owed by Noah, discharged by learning. Label debt:verification.
  authority: "PROTOCOL.md §5, #189"
Source Debt:
  gloss: An assertion the record has never sourced. Owed by an agent, discharged by search. Label debt:source.
  authority: "#189"
defence:
  gloss: >
    What changed and why, in Noah's own words, on the pull request thread. Judged for
    COMPREHENSION, never prose — a checker rejecting on polish has broken the instrument.
  authority: PROTOCOL.md §5 "The defence — which changes owe one"

# --- THE KERNEL'S THREE TERMS. Added under #229. -------------------------------
# #226 collapsed mint, amend and retire off the intent axis and onto ordinary
# intents acting on one class. They survive HERE, which is what "survives as a
# glossary term" means in practice: the word stays, the machinery does not.

mint:
  gloss: >
    Bring a new Operation into being — `propose:add@operation-cell`. Not an intent.
    Its postconditions are what the catch-all's mint path hands off to.
  authority: premise 7; "#226"; "#229"

amend:
  gloss: >
    Change an existing Operation — `propose:edit@operation-cell`. Reachable from the
    catch-all, and the landing site for a NOVEL NULL that a flag predicate can carry.
    Where no flag can carry it, a novel null is a `mint` instead, not an amend.
  authority: premise 7; "#226"; "#229"

retire:
  gloss: >
    Take an Operation out of use — `propose:supersede@operation-cell`, leaving a
    tombstone with a forward pointer. Where nothing was ever acted under the cell,
    the branch is `propose:delete@operation-cell` instead and nothing remains. NOT
    reachable from the catch-all.
  authority: premise 8; "#226"; "#229"

tombstone:
  gloss: >
    A cell carrying `ruling: retired` and a forward pointer to its successor. It
    renders, so that an action taken under it stays resolvable to the cell that
    governed it.
  authority: "#229"

amendment capacity:
  gloss: >
    What an amendment to the Operation set can absorb without re-keying it. Exceeded
    when the key or an axis changes — an intent added or removed, a flag added or
    removed, the mode set changed — at which point every cell must be re-ruled. This
    is the apparatus MAJOR, and it is PROTOCOL.md §2's MAJOR shape applied to
    machinery rather than to belief.
  authority: PROTOCOL.md §2; "#229"

kernel:
  gloss: >
    The classes whose instances determine the ruling of a cell. Each carries
    `modes: [propose]`, and the set is DISCOVERED by scanning classes for that field
    rather than held as a list. A reach rule, not a custody rule: agents draft and
    generate the text freely, and what no automated path may do is LAND a change to
    it as a step or a side effect.
  authority: premise 7 as revised by "#226", scoped by "#229"

# COUPLINGS — the ones visible now. Settled under #228, on Map #220.
#
# A COUPLING IS NOT A NULL. Premise 18 draws the line and #228 tested it: "an
# artifact generated by a research loop may not land in Drive without landing in
# the repository" is a LEGAL action carrying a companion obligation. Filing it as
# a null would silently delete a legal action — the actor would be told "you
# cannot do this" when the truth is "you must also do that".
#
# WHERE A COUPLING LIVES. On the cell that INCURS the obligation, as a `couples:`
# field — never on the companion, and never in a register of its own. A mutual
# obligation is therefore TWO records, one on each side, and that is deliberate:
# a shared object would let one half be true while the other was never written,
# which is the drift premise 20 exists against. #224's prototype invented the
# field ad hoc on regenerate@curriculum-open; #228 ratifies it and adds two
# things — a `when:` ordering, and the typing below.
#
# A COMPANION IS ALWAYS A CELL, NEVER A BARE CLASS. "close@debt-verification
# couples to research-document" does not say what must happen to it. Cells
# compose; classes do not.
#
# `when:` takes before | with | after, and it is an ORDERING, not a strength.
# Every coupling below is mandatory. What varies is when the companion obligation
# falls due relative to the act:
#   before  the companion must already be true when this act runs
#   with    the two land together; neither is complete alone
#   after   this act creates an obligation that falls due later
#
# THIS FILE IS A STAGING GROUND, NOT A REGISTER. Six couplings are enumerated
# here because five of the six cells that carry them DO NOT EXIST YET — the
# ~130-cell transcription has not run. Each one migrates onto its cell as
# `couples:` when that cell is written, and this file shrinks to nothing. Holding
# them in a standing register would be exactly the internal list premise 20
# forbids: the register and the cells would drift, and the register would win by
# being easier to read.

id: couplings
authority: "#228, on #220 — premise 18"

couplings:
  - id: drive-output-needs-its-repository-half
    from: add@run-output
    to: add@run-manifest
    when: before
    obligation: >
      The repository half lands first. A run's output may not enter Drive without
      the manifest that cites it existing in the repository.
    reason: >
      The repository half is the auditable one — it is in git, it is in a clone,
      and it is the half a reader can check. #203's finding is the general case:
      fifteen discharges were asserted on a snapshot no clone can verify.
    authority: docs/DATA-PROTOCOL.md §5; premise 18's own example
    note: >
      This is the coupling premise 18 was written from, and the one #228 was told
      to establish a home for. Its cell, add@run-output, is also the ticket's
      hard cell for enforcement — see unenforceable, below.

  - id: transcript-resolves-through-the-index
    from: add@transcript
    to: add@index-manifest
    when: with
    obligation: A transcript is not landed until its hash -> path row exists in the Index.
    reason: >
      #227 found the transcript's address is TWO HOPS — a Session: citation
      resolves hash -> path THROUGH index-manifest — and ruled that a coupling
      rather than an address feature. An address that silently depends on a second
      artifact is #115 exactly: the manifest every citation resolved through did
      not exist, and nothing said so until someone looked.
    authority: "#227; #115"

  - id: dispatch-owes-a-close
    MIGRATED: >
      #232 wrote both cells, so this entry has moved onto them and is retained here only as
      the record of where it was staged. It is the first of #228's six to land, per the
      chore that ticket left behind.
    from: dispatch@ticket
    to: close@ticket
    when: after
    obligation: A mandate creates an obligation to record its discharge.
    reason: >
      #226 ruled `dispatch` needs no return half on the axis: "the return is
      `close` — the mandate is the obligation, the work product is the companion
      artifact." The two ends of one loop are a coupling rather than a ninth
      intent saying the same thing.
    authority: "#226; premise 17"

  - id: close-needs-its-proof
    from: close@debt-verification
    to: add@research-document
    when: before
    obligation: >
      The discharge is invalid unless the research document AND the tier-promoting
      commit already exist. `close` is the only intent with a precondition on a
      companion artifact, which makes it the natural home for couplings.
    reason: >
      "Add debt:discharged, close the issue, and cite the SHA that promoted the
      tier" — mechanically a state edit, but carrying a PROOF OBLIGATION no edit
      does. tools/snapshot_debt.py already treats a mismatch as a bookkeeping
      error, so the obligation is real today and unstated today.
    authority: curriculum/README.md; "#226"
    note: The companion commit is not a class; it is cited by SHA as evidence, which is what `close` records.

  - id: a-resolution-is-not-landed-until-the-map-says-so
    from: close@ticket
    to: edit@map
    when: with
    obligation: >
      A ticket resolution is incomplete until the map's Decisions-so-far carries
      its context pointer.
    reason: >
      The map is an INDEX: a decision lives in exactly one place, its ticket, and
      the map points at it. A closed ticket the map does not point at is a decision
      nobody can find from the map, which is the only place anyone looks.
    note: >
      Found by running it. This session closes #228 and appends to #220 — the
      coupling was discovered by being under it, which is premise 16's test
      arriving unasked.

  - id: extraction-produces-a-node
    from: add@shelf-paper
    to: add@source-node
    when: with
    obligation: A paper entering the Shelf is not usable by the record until its Source node exists.
    reason: >
      "Extract / reproduce" collapsed to add@source-node on #226's class axis, and
      literature/ rules that a reproduction produces a NEW node rather than editing
      one. The Drive-side artifact and the repository-side node are one act with
      two halves — the same shape as the run coupling above, on a different pair.
    authority: docs/DATA-PROTOCOL.md §2; literature/README.md

# ---------------------------------------------------------------------------
# UNENFORCEABLE — a field, not a coupling, recorded here because #228 found it
# ---------------------------------------------------------------------------
#
# `enforcement:` is a required field on every ruled-in cell, taking
# ci | command | human-step | none. A cell whose obligation nothing can check
# reads `none` and is UNENFORCEABLE — countable, queryable, and a driver.
#
# Noah, ruling it: having unenforceable cells is an important step to have,
# because there will be some future event where there is no mechanism for
# enforcing an action he wants to take — and that requires ADDING THE MECHANISM.
# So an unenforceable cell is not a defect to be hidden or a cell to be refused;
# it is a mechanism-shaped hole with an address.
#
# add@run-output is the worked case: Drive has no CI, no ancestry, and no
# publish.sh (#42), so nothing can check that the coupling above was honoured.
# Noah, on the same: the lack of CI for Drive and the lack of ancestry are
# TEMPORARY, and this unenforceability is what drives the creation of Drive CI.
# That is the field working — "the Drive surface has no mechanised path at all"
# becomes a number instead of an anecdote.
